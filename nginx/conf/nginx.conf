worker_processes 1;

events {}

http {
    include     mime.types;

    access_log  logs/access.log;
    error_log   logs/error.log debug;

    server {
        listen       8080;

        location / {
            root   "C:/Users/Andre Torres/.gemini/antigravity/worktrees/bullshit/add_rooms_sidebar_splashscreen/frontend/dist";
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        location = / {
            allow 127.0.0.1;
            deny all;
            root   "C:/Users/Andre Torres/.gemini/antigravity/worktrees/bullshit/add_rooms_sidebar_splashscreen/frontend/dist";
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        location /config {
            proxy_pass http://127.0.0.1:5000;
        }

        location /token {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /participants {
            proxy_pass http://127.0.0.1:5000;
        }

        location /logs {
            proxy_pass http://127.0.0.1:5000;
        }

        location /room-config {
            proxy_pass http://127.0.0.1:5000;
        }
    }
}
