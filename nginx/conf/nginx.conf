worker_processes 1;

events {}

http {
    include     mime.types;

    access_log  logs/access.log;
    error_log   logs/error.log warn;

    upstream backend {
        server 127.0.0.1:5000;
    }

    server {
        listen       8080;

        root    "E:/Documents/code/newport/focalpoint/frontend/dist";
        index   index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = / {
            allow 127.0.0.1;
            deny all;
            try_files $uri $uri/ /index.html;
        }

        location /config {
            proxy_pass http://backend;
        }

        location /token {
            proxy_pass http://backend;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /participants {
            proxy_pass http://backend;
        }

        location /logs {
            proxy_pass http://backend;
        }

        location /room-config {
            proxy_pass http://backend;
        }

        location /rooms {
            proxy_pass http://backend;
        }
    }
}
