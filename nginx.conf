user andre;

events {}

http {
    include /home/andre/Projects/CAPSTONE_PROJECT/focalpoint/nginx-portable/conf/mime.types;

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;

        ssl_certificate server/certs/cert.pem;
        ssl_certificate_key server/certs/key.pem;

        location / {
            root /home/andre/Projects/CAPSTONE_PROJECT/focalpoint/public;
            index present.html;
            try_files $uri $uri/ =404;
        }

        location /token {
            proxy_pass http://127.0.0.1:5000;
        }

        location /rtc {
            proxy_pass http://127.0.0.1:7880;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    error_log /dev/stdout info;
    access_log /dev/stdout;
}