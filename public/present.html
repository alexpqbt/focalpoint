<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focalpoint Presenter</title>
  <link rel="stylesheet" href="css/present.css">
</head>
<body>
  <video id="preview" autoplay muted playsinline></video>
  <div id="qrcode"></div>
  <p id="ipAddress"></p>
  <div class="btn-group">
    <button id="shareBtn" class="button">Start Sharing</button> 
    <button id="stopBtn" class="button">Stop Sharing</button> 
  </div>
  <p id="status"></p>
  <div id="participants-panel">
    <h2>Participants (<span id="participant-count">0</span>)</h2>
    <ul id="participant-list"></ul>
  </div>

  <script src="modules/livekit-client.umd.min.js"></script>
  <script src="modules/qrcode.min.js"></script>
  <script type="module" src="js/present.js"></script>
</body>
</html>
