<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focalpoint Viewer</title>
  <link rel="stylesheet" href="css/view.css">
</head>
<body>
  <button id="startBtn">Tap to Start Viewing</button>
  <div id="enterDisplayName" class="hidden">
    <h1>Join Session</h1>
    <p>Enter your name to access the live broadcast</p>
    <input id="name" type="text" placeholder="Your Name">
    <button id="submitDisplayName" type="submit">Join</button>
  </div>
  <video id="screen" class="hidden" autoplay playsinline></video>
  <button id="disconnect" class="hidden">Disconnect</button>
  <button id="showMessagePanel" class="hidden">Send Message</button>
  <div id="messagePanel" class="hidden">
    <h1>Message to Host</h1>
    <textarea name="message" id="message" placeholder="Type your response..."></textarea>
    <button id="submitMessage">Submit</button>
  </div>

  <script src="modules/livekit-client.umd.min.js"></script>
  <script type="module" src="js/view.js"></script>
</body>
</html>
